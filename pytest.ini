[pytest]
# where tests live
testpaths = tests

# file pattern for tests
python_files = test_*.py *_test.py

# useful default options:
#  - write Allure results to allure-results (can still be overridden on CLI)
#  - run quietly (-q) but keep useful failure output
#  - use xdist auto workers for parallel runs (requires pytest-xdist installed)
addopts = --alluredir=allure-results -q -n 0

# recommended minimum pytest version (optional)
minversion = 6.0

# register custom markers used in your tests / framework
markers =
    asyncio: mark test as asyncio (pytest-asyncio)
    feature(name): allure feature or functional area
    smoke: smoke tests
    regression: regression tests
    slow: slower tests

# show log output in real time (helpful during debugging)
log_cli = true
log_cli_level = INFO

# warnings you want to silence by default
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
asyncio_mode = auto
